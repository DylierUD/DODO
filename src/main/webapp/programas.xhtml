<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Programas Académicos</title>
</h:head>

<h:body>

    <h:form id="form">

        <p:growl id="mensajes" showDetail="true" life="4000"/>

        <h1>Administración de Programas Académicos</h1>

        <div style="margin-bottom: 15px; display: flex; gap: 10px;">
            
            <p:button 
                    value="Volver al Panel Administrador" 
                    icon="pi pi-arrow-left" 
                    outcome="administrador" 
                    styleClass="ui-button-secondary"/>

            
            <p:commandButton
                    value="Agregar Nuevo Programa"
                    icon="pi pi-plus"
                    action="#{programaCrudBean.nuevoPrograma}"
                    update="@form"
                    rendered="#{not programaCrudBean.mostrarFormulario}"/>
        </div>
        
        <p:panel header="#{empty programaCrudBean.nombreAnterior ? 'Nuevo Programa' : 'Editar Programa'}"
                 rendered="#{programaCrudBean.mostrarFormulario}"
                 style="margin-bottom: 20px;">

            <h:panelGrid columns="3" cellpadding="5">
                <p:outputLabel for="nombre" value="Nombre del programa:"/>

                <p:inputText
                        id="nombre"
                        value="#{programaCrudBean.nombrePrograma}"
                        required="true"
                        requiredMessage="Ingrese el nombre del programa."
                        placeholder="Ej: Ingeniería de Software"/>

                <h:panelGroup>
                    
                    <p:commandButton
                            value="Guardar"
                            icon="pi pi-check"
                            action="#{programaCrudBean.agregarPrograma}"
                            update="@form"
                            rendered="#{empty programaCrudBean.nombreAnterior}"/>

                    
                    <p:commandButton
                            value="Actualizar"
                            icon="pi pi-check"
                            action="#{programaCrudBean.actualizarPrograma}"
                            update="@form"
                            rendered="#{not empty programaCrudBean.nombreAnterior}"/>

                    
                    <p:commandButton
                            value="Cancelar"
                            icon="pi pi-times"
                            action="#{programaCrudBean.cancelar}"
                            update="@form"
                            immediate="true"
                            style="margin-left: 5px;"
                            styleClass="ui-button-secondary"/>
                </h:panelGroup>
            </h:panelGrid>

        </p:panel>


       <p:panel header="Programas registrados">

            <p:dataTable
                    id="tablaProgramas"
                    value="#{programaCrudBean.programas}"
                    var="programa"
                    paginator="true"
                    rows="10"
                    emptyMessage="No hay programas registrados.">

                
                <p:column
                        headerText="Programa académico"
                        filterBy="#{programa.nombrePrograma}"
                        filterMatchMode="contains"
                        sortBy="#{programa.nombrePrograma}">

                    <h:outputText value="#{programa.nombrePrograma}"/>
                </p:column>

                
                <p:column
                        headerText="Estudiantes"
                        style="text-align:center">

                    <h:outputText value="#{programa.aspirantes.size()}"/>
                </p:column>

                
                <p:column
                        headerText="Acciones"
                        style="text-align:center">

                    
                    <p:commandButton
                            value="Editar"
                            icon="pi pi-pencil"
                            action="#{programaCrudBean.prepararEdicion(programa)}"
                            update="@form"
                            styleClass="ui-button-warning"/>

                    
                    <p:commandButton
                            value="Eliminar"
                            icon="pi pi-trash"
                            action="#{programaCrudBean.eliminarPrograma(programa)}"
                            update="@form"
                            style="margin-left: 5px;"
                            styleClass="ui-button-danger">

                        <p:confirm
                                header="Confirmar eliminación"
                                message="¿Está seguro de eliminar este programa?"
                                icon="pi pi-exclamation-triangle"/>
                    </p:commandButton>

                </p:column>

            </p:dataTable>

        </p:panel>


        <p:confirmDialog global="true" showEffect="fade" hideEffect="fade">
            <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
            <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no" icon="pi pi-times"/>
        </p:confirmDialog>

    </h:form>

</h:body>
</html>
