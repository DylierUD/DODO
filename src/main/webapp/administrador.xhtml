<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" xmlns:p="http://primefaces.org/ui">
<h:head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Panel Administrador</title>
</h:head>
<h:body>
	<h:form>
		<div class="card">
			<h1>Estudiantes Inscritos</h1>

		<p:growl id="mensajes" showDetail="true" />
		<p:button
    value="Gestionar Programas Académicos"
    icon="pi pi-book"
    outcome="programas"/>
			<p:accordionPanel value="#{administradorBean.programaBean.programas}" var="prog">
				<p:tab title="#{prog.nombrePrograma} (#{prog.aspirantes.size()} inscritos)">

					<p:dataTable var="a" value="#{prog.aspirantes}">
						<p:column headerText="Identificación">
							<h:outputText value="#{a.identificacion}" />
						</p:column>
						<p:column headerText="Nombres">
							<h:outputText value="#{a.nombres}" />
						</p:column>
						<p:column headerText="Apellidos">
							<h:outputText value="#{a.apellidos}" />
						</p:column>
						<p:column headerText="Correo">
							<h:outputText value="#{a.correo}" />
						</p:column>
						<p:column headerText="Teléfono">
							<h:outputText value="#{a.telefono}" />
						</p:column>
						<p:column headerText="Fecha/Hora">
							<h:outputText value="#{a.fechaInscripcion}">
								<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
							</h:outputText>
						</p:column>
						
							<p:column headerText="Acción">
							    <p:commandButton
							        value="Eliminar"
							        icon="pi pi-trash"
							        styleClass="ui-button-raised ui-button-danger"
							        action="#{aspiranteBean.eliminarInscripcion(a)}"
							        update="@form"
							        process="@this">
							    </p:commandButton>
							</p:column>
						
					</p:dataTable>

				</p:tab>
			</p:accordionPanel>

			<p:button value="Volver al inicio" outcome="index" style="margin-top:15px;" />
		</div>
	</h:form>
</h:body>
</html>
