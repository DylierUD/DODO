<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:h="jakarta.faces.html"
	xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets"
	xmlns:p="http://primefaces.org/ui">
<h:head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
	<title>Universidad del Dodo</title>
	<h:outputStylesheet library="css" name="estilos.css" />
</h:head>
<h:body styleClass="tema-inicio">

	<ui:include src="/WEB-INF/includes/cabecera.xhtml">
		<ui:param name="activo" value="inicio" />
		<ui:param name="seccion" value="Portal académico" />
		<ui:param name="titulo" value="Universidad del Dodo" />
		<ui:param name="subtitulo" value="Sistema de inscripción y gestión de programas académicos. Elige el acceso que corresponde a tu perfil." />
	</ui:include>

	<h:form>
		<div class="card" style="width:350px; margin:auto;">
			<h:graphicImage library="images" name="logo-dodo.png"
				alt="Universidad del Dodo" styleClass="udd-logo-hero" />
			<p class="udd-lema">Fundada en Bogotá D.C.</p>

			<p:panel header="Bienvenido">
				<h:panelGrid columns="1">
					<h:outputText value="Selecciona tu tipo de acceso:" />
					<p:button outcome="estudiante" value="Aspirante / Estudiante" />
					<p:button outcome="administrador" value="Administrador" />
				</h:panelGrid>
			</p:panel>
		</div>
	</h:form>

	<div class="udd-pie">Universidad del Dodo &#183; Bogotá D.C. &#183; Registro Académico</div>
</h:body>
</html>
